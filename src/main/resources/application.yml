spring:
  application:
    name: hello-k8s-sidecar

server:
  port: 8080
  shutdown: graceful            # finish in-flight requests on SIGTERM

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true           # AC-8: /actuator/health/liveness and /readiness

logging:
  # logging.file.name is NOT set here. It is set per environment:
  #   - Kubernetes: LOGGING_FILE_NAME=/var/log/app/app.log (AC-9)
  #   - Tests:      target/test-logs/app.log
  # When unset (e.g. local `mvn spring-boot:run`) logs go to the console only.
  logback:
    rollingpolicy:              # AC-15
      max-file-size: 10MB
      max-history: 5
